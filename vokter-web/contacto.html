<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Contacto — VOKTER</title>
<meta name="description" content="Contacta al equipo de VOKTER.">
<meta name="theme-color" content="#0A57F5">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='12' fill='%230A57F5'/%3E%3Cpath d='M10.500 12 20 29l9.500-17' fill='none' stroke='white' stroke-width='4.500' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Unbounded:wght@500;600;700;800&display=swap">
<link rel="stylesheet" href="css/styles.css">
<script>try{if(localStorage.getItem('vokter-theme')==='dark')document.documentElement.setAttribute('data-theme','dark')}catch(e){}</script>
</head>
<body>

<main id="main">
  <div class="container">
    <section class="page-hero">
      <nav class="crumbs" aria-label="Ruta de navegación"><a href="index.html">Inicio</a><span>/</span><span>Contacto</span></nav>
      <h1>Hablemos</h1>
      <p>Cuéntanos qué necesitas: un pedido, un cambio o una idea. Te respondemos pronto.</p>
    </section>
    <div class="contact-grid">
      <section class="panel">
        <h2>Escríbenos</h2>
        <form class="form-grid" id="contact-form" novalidate>
          <div class="form-two">
            <label>Nombre<input type="text" name="nombre" autocomplete="name" required></label>
            <label>Correo<input type="email" name="email" autocomplete="email" required></label>
          </div>
          <label>Tema
            <select name="tema">
              <option>Tengo una duda sobre un pedido</option>
              <option>Quiero un cambio o devolución</option>
              <option>Consulta sobre un producto</option>
              <option>Otro</option>
            </select>
          </label>
          <label>Mensaje<textarea name="mensaje" required></textarea></label>
          <button type="submit" class="btn btn-primary" style="justify-self:start">Enviar mensaje</button>
        </form>
      </section>
      <aside class="panel">
        <h2>Otros canales</h2>
        <div class="info-list" id="info-list"></div>
      </aside>
    </div>
  </div>
</main>

<script type="module" src="js/contacto.js"></script>
</body>
</html>
