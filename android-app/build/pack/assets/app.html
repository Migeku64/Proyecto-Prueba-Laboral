<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b1d38">
  <meta name="description" content="KREW móvil: tecnología y streetwear urbano.">
  <link rel="manifest" href="app.webmanifest">
  <link rel="stylesheet" href="css/app.css">
  <title>KREW | Tienda móvil</title>
</head>
<body>
  <div class="store-app">
    <header class="mobile-header">
      <a class="mobile-brand" href="app.html"><span>KRE</span><b>W</b></a>
      <div class="mobile-header-actions"><button class="header-icon" id="account-button" aria-label="Mi cuenta">◎</button><button class="header-icon cart-trigger" aria-label="Carrito"><span>□</span><em id="cart-count">0</em></button></div>
    </header>
    <main>
      <section class="store-hero"><div><p class="hero-kicker">KREW / 2026</p><h1>Equipo para<br>la calle.</h1><p>Audio, calzado, gadgets y apparel seleccionados para moverte a tu ritmo.</p><button class="hero-button" data-scroll-products>Explorar colección <span>→</span></button></div><div class="hero-orbit"><span class="orbit-label">01<br><small>DROP</small></span><div class="hero-product-shape"><i></i><b></b><em></em></div></div></section>
      <section class="store-content">
        <div class="section-row"><div><p class="eyebrow">Selección KREW</p><h2>Encuentra tu próximo esencial</h2></div><button class="filter-trigger" id="filter-button">Filtrar <span>≡</span></button></div>
        <div class="search-wrap"><span>⌕</span><input id="mobile-search" type="search" placeholder="Buscar productos" aria-label="Buscar productos"><button id="clear-search" aria-label="Limpiar búsqueda">×</button></div>
        <div class="category-scroll" aria-label="Categorías"><button class="category-chip active" data-category="todos">Todo</button><button class="category-chip" data-category="audio">Audio</button><button class="category-chip" data-category="calzado">Calzado</button><button class="category-chip" data-category="apparel">Apparel</button><button class="category-chip" data-category="gadgets">Gadgets</button><button class="category-chip" data-category="gaming">Gaming</button></div>
        <div class="promo-strip"><div><span>DROP 02 / OFERTAS</span><strong>Hasta 20% off<br>en seleccionados</strong></div><span class="promo-arrow">↗</span></div>
        <div class="product-heading"><h2>Destacados</h2><span id="product-count">12 productos</span></div>
        <div class="mobile-products" id="mobile-products"><div class="loading-state">Cargando selección...</div></div>
      </section>
    </main>
    <nav class="store-nav" aria-label="Navegación de la tienda"><button class="store-nav-item active" data-nav="inicio"><span>⌂</span>Inicio</button><button class="store-nav-item" data-nav="buscar"><span>⌕</span>Buscar</button><button class="store-nav-item" data-nav="favoritos"><span>♡</span>Favoritos</button><button class="store-nav-item cart-trigger" data-nav="carrito"><span>□<em id="cart-count-bottom">0</em></span>Carrito</button></nav>
  </div>
  <div class="toast" id="toast" role="status"></div>
  <dialog id="product-dialog"><div class="product-dialog-inner"><button class="dialog-close" aria-label="Cerrar">×</button><div id="dialog-content"></div></div></dialog>
  <script src="js/icons.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
